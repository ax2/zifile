[package]
name = "zifile-desktop"
description = "Modern Windows desktop interface for ZiFile"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
accessible-ui = ["dep:dioxus", "dep:dioxus-document", "dep:dioxus-html", "dep:tokio"]

[[bin]]
name = "zifile-desktop-accessible"
path = "src/accessible_main.rs"
required-features = ["accessible-ui"]

[[bench]]
name = "entry_browser"
harness = false

[dependencies]
dioxus = { workspace = true, optional = true }
dioxus-document = { workspace = true, optional = true }
dioxus-html = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
iced.workspace = true
rfd.workspace = true
serde_json.workspace = true
sys-locale.workspace = true
zifile-core.workspace = true
zifile-worker-protocol.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[build-dependencies]
winresource.workspace = true

[dev-dependencies]
criterion.workspace = true
tempfile.workspace = true
