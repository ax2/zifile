name: Scheduled fuzzing

on:
  schedule:
    - cron: '23 3 * * 1'
  workflow_dispatch:
    inputs:
      campaign:
        description: Fuzz campaign to run
        required: true
        default: all
        type: choice
        options:
          - all
          - archive-parsers

permissions:
  contents: read

concurrency:
  group: scheduled-fuzz
  cancel-in-progress: false

jobs:
  fuzz:
    name: Run bounded fuzz campaigns
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: Fuzz path policy
        if: github.event_name == 'schedule' || inputs.campaign == 'all'
        run: cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu path_policy -- -max_total_time=180 -timeout=10
      - name: Fuzz format detection
        if: github.event_name == 'schedule' || inputs.campaign == 'all'
        run: cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu format_detection -- -max_total_time=180 -timeout=10
      - name: Fuzz archive parsers
        run: cargo +nightly fuzz run --fuzz-dir fuzz --target x86_64-unknown-linux-gnu archive_parsers -- -max_total_time=180 -timeout=10 -max_len=262144 -rss_limit_mb=2048
      - name: Preserve crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14
