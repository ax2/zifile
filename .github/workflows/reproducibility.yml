name: Reproducible Windows builds

on:
  workflow_dispatch:
  pull_request:
    paths:
      - rust-toolchain.toml
      - Cargo.lock
      - Cargo.toml
      - '**/Cargo.toml'
      - .github/workflows/release.yml
      - .github/workflows/reproducibility.yml
      - tests/reproducibility/**
  schedule:
    - cron: '19 3 1 * *'

permissions:
  contents: read

concurrency:
  group: reproducibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    name: Windows ${{ matrix.architecture }} double build
    runs-on: windows-2022
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - name: Normalize Windows checkout line endings
        shell: pwsh
        run: |
          git config --local core.autocrlf false
          git config --local core.eol lf
          $utf8NoBom = [System.Text.UTF8Encoding]::new($false)
          foreach ($relativePath in @(
            'tests/accessibility/keyboard-form.ps1',
            'tests/reproducibility/windows-build.ps1'
          )) {
            $path = Join-Path $PWD $relativePath
            $content = [System.IO.File]::ReadAllText($path)
            $content = $content.Replace("`r`n", "`n").Replace("`r", "`n")
            [System.IO.File]::WriteAllText($path, $content, $utf8NoBom)
          }
          git reset --quiet HEAD -- tests/accessibility/keyboard-form.ps1 tests/reproducibility/windows-build.ps1
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) { throw 'git status failed after checkout normalization' }
          if ($dirty.Count -ne 0) {
            throw "Checkout remained dirty after line-ending normalization: $($dirty -join '; ')"
          }
      - uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.architecture == 'x64' && 'x86_64-pc-windows-msvc' || 'aarch64-pc-windows-msvc' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: reproducibility-${{ matrix.architecture }}
      - name: Build twice and compare SHA-256
        shell: pwsh
        run: |
          ./tests/reproducibility/windows-build.ps1 `
            -Architecture '${{ matrix.architecture }}' `
            -EvidencePath "$env:RUNNER_TEMP\reproducibility-${{ matrix.architecture }}.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: reproducibility-${{ matrix.architecture }}
          path: ${{ runner.temp }}/reproducibility-${{ matrix.architecture }}.json
          if-no-files-found: error
          retention-days: 30
