name: Release

on:
  workflow_dispatch:
    inputs:
      signing_provider:
        description: Sign staged artifacts in the protected production environment
        required: true
        type: choice
        default: none
        options:
          - none
          - digicert-stm
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  windows:
    name: Windows ${{ matrix.architecture }}
    # Pin VS 2022 while the Windows 2025/VS 2026 image has known ARM64
    # toolset compatibility regressions.
    runs-on: windows-2022
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      RUSTFLAGS: -C link-arg=/Brepro
      CARGO_BUILD_JOBS: 1
      ZIFILE_MSIX_IDENTITY: ${{ vars.ZIFILE_MSIX_IDENTITY }}
      ZIFILE_MSIX_PUBLISHER: ${{ vars.ZIFILE_MSIX_PUBLISHER }}
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.architecture }}
      - name: Resolve package version
        id: version
        shell: pwsh
        run: |
          $arguments = @{}
          if ('${{ github.event_name }}' -ne 'workflow_dispatch') {
            $arguments.ExpectedVersion = '${{ github.ref_name }}'
          }
          $version = ./scripts/Test-VersionConsistency.ps1 @arguments | ConvertFrom-Json
          ./scripts/Test-ReleaseNotes.ps1 @arguments
          $readinessArguments = @{}
          if ('${{ github.event_name }}' -ne 'workflow_dispatch' -and '${{ github.ref_name }}' -notmatch '-') {
            $readinessArguments.RequireReleaseReady = $true
          }
          ./scripts/Test-ReleaseReadiness.ps1 @readinessArguments
          "semver=$($version.version)" >> $env:GITHUB_OUTPUT
          "msix=$($version.msix_version)" >> $env:GITHUB_OUTPUT
      - name: Test workspace
        if: matrix.architecture == 'x64'
        run: cargo test --workspace --all-targets --all-features --locked
      - name: Enforce tagged-release store evidence
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./packaging/store/Test-Screenshots.ps1 -RequireComplete
      - name: Build MSIX and runnable executables
        shell: pwsh
        run: |
          $arguments = @{
            Version = '${{ steps.version.outputs.msix }}'
            Architecture = '${{ matrix.architecture }}'
          }
          if ($env:ZIFILE_MSIX_IDENTITY) { $arguments.IdentityName = $env:ZIFILE_MSIX_IDENTITY }
          if ($env:ZIFILE_MSIX_PUBLISHER) { $arguments.Publisher = $env:ZIFILE_MSIX_PUBLISHER }
          ./packaging/msix/Build-Package.ps1 @arguments
      - name: Build accessible UI candidate package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          ./packaging/msix/Build-Package.ps1 `
            -Version '${{ steps.version.outputs.msix }}' `
            -Architecture '${{ matrix.architecture }}' `
            -AccessibleUi
      - name: Stage release files
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.msix }}'
          $arch = '${{ matrix.architecture }}'
          $source = "dist/ZiFile-$version-windows-$arch"
          $output = "artifacts-$arch"
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          Copy-Item -LiteralPath "$source/zifile-desktop.exe" -Destination "$output/zifile-desktop-windows-$arch.exe"
          Copy-Item -LiteralPath "$source/zifile.exe" -Destination "$output/zifile-cli-windows-$arch.exe"
          Copy-Item -LiteralPath "$source/zifile-worker.exe" -Destination "$output/zifile-worker-windows-$arch.exe"
          Copy-Item -LiteralPath "$source/zifile-shell.dll" -Destination "$output/zifile-shell-windows-$arch.dll"
          Copy-Item -LiteralPath "dist/ZiFile-$version-windows-$arch.msix" -Destination $output
          Copy-Item -LiteralPath "dist/ZiFile-$version-windows-$arch.audit.json" -Destination $output
          $candidate = "dist/ZiFile-$version-windows-$arch-accessible"
          if (Test-Path -LiteralPath $candidate) {
            Copy-Item -LiteralPath "$candidate/zifile-desktop.exe" -Destination "$output/zifile-desktop-accessible-windows-$arch.exe"
            Copy-Item -LiteralPath "$candidate.msix" -Destination $output
            Copy-Item -LiteralPath "$candidate.audit.json" -Destination $output
          }
          Get-FileHash "$output/*" -Algorithm SHA256 |
            Sort-Object Path |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content -LiteralPath "$output/SHA256SUMS-$arch.txt"
      - name: Attest Windows artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts-${{ matrix.architecture }}/*
      - uses: actions/upload-artifact@v6
        with:
          name: windows-${{ matrix.architecture }}
          path: artifacts-${{ matrix.architecture }}/*
          if-no-files-found: error

  sign:
    name: Sign Windows ${{ matrix.architecture }}
    if: startsWith(github.ref, 'refs/tags/v') || inputs.signing_provider == 'digicert-stm'
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 30
    environment: production-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    concurrency:
      group: production-signing-${{ matrix.architecture }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        architecture: [x64, arm64]
    env:
      ZIFILE_SIGNING_PROVIDER: digicert-stm
      ZIFILE_MSIX_IDENTITY: ${{ vars.ZIFILE_MSIX_IDENTITY }}
      ZIFILE_MSIX_PUBLISHER: ${{ vars.ZIFILE_MSIX_PUBLISHER }}
      SM_HOST: ${{ vars.SM_HOST }}
      SM_API_KEY: ${{ secrets.SM_API_KEY }}
      SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
      SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
      SM_KEYPAIR_ALIAS: ${{ vars.SM_KEYPAIR_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve signed package version
        id: version
        shell: pwsh
        run: |
          $version = ./scripts/Test-VersionConsistency.ps1 | ConvertFrom-Json
          "msix=$($version.msix_version)" >> $env:GITHUB_OUTPUT
      - uses: actions/download-artifact@v7
        with:
          name: windows-${{ matrix.architecture }}
          path: artifacts-${{ matrix.architecture }}
      - name: Validate protected cloud-signing inputs
        shell: pwsh
        run: |
          ./packaging/msix/Test-CloudSigningInputs.ps1 `
            -Provider $env:ZIFILE_SIGNING_PROVIDER `
            -IdentityName $env:ZIFILE_MSIX_IDENTITY `
            -Publisher $env:ZIFILE_MSIX_PUBLISHER `
            -HostAvailable:(-not [string]::IsNullOrWhiteSpace($env:SM_HOST)) `
            -ApiKeyAvailable:(-not [string]::IsNullOrWhiteSpace($env:SM_API_KEY)) `
            -ClientCertificateAvailable:(-not [string]::IsNullOrWhiteSpace($env:SM_CLIENT_CERT_FILE_B64)) `
            -ClientCertificatePasswordAvailable:(-not [string]::IsNullOrWhiteSpace($env:SM_CLIENT_CERT_PASSWORD)) `
            -KeypairAliasAvailable:(-not [string]::IsNullOrWhiteSpace($env:SM_KEYPAIR_ALIAS))
      - name: Prepare ephemeral client authentication certificate
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'Certificate_pkcs12.p12'
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:SM_CLIENT_CERT_FILE_B64)
          )
          "SM_CLIENT_CERT_FILE=$certificate" >> $env:GITHUB_ENV
      - name: Isolate signable files
        shell: pwsh
        run: |
          $arch = '${{ matrix.architecture }}'
          $source = "artifacts-$arch"
          $input = "signing-input-$arch"
          New-Item -ItemType Directory -Path $input -Force | Out-Null
          Copy-Item -LiteralPath "$source/zifile-desktop-windows-$arch.exe" -Destination $input
          Copy-Item -LiteralPath "$source/zifile-cli-windows-$arch.exe" -Destination $input
          Copy-Item -LiteralPath "$source/zifile-worker-windows-$arch.exe" -Destination $input
          Copy-Item -LiteralPath "$source/zifile-shell-windows-$arch.dll" -Destination $input
          Copy-Item -LiteralPath "$source/ZiFile-${{ steps.version.outputs.msix }}-windows-$arch.msix" -Destination $input
      - name: Sign with DigiCert Binary Signing
        uses: digicert/code-signing-software-trust-action@v1.2.1
        with:
          simple-signing-mode: true
          input: signing-input-${{ matrix.architecture }}
          keypair-alias: ${{ env.SM_KEYPAIR_ALIAS }}
          digest-alg: SHA-256
          timestamp: true
          unsigned: true
          fail-fast: true
          zero-exit-code-on-failure: false
        env:
          SM_HOST: ${{ env.SM_HOST }}
          SM_API_KEY: ${{ env.SM_API_KEY }}
          SM_CLIENT_CERT_PASSWORD: ${{ env.SM_CLIENT_CERT_PASSWORD }}
      - name: Verify signed release artifacts
        shell: pwsh
        run: |
          $arch = '${{ matrix.architecture }}'
          $output = "artifacts-$arch"
          Get-ChildItem -LiteralPath "signing-input-$arch" -File |
            Copy-Item -Destination $output -Force
          ./packaging/msix/Test-SignedReleaseArtifacts.ps1 `
            -ArtifactDirectory $output `
            -Architecture $arch `
            -ExpectedVersion '${{ steps.version.outputs.msix }}' `
            -ExpectedIdentityName $env:ZIFILE_MSIX_IDENTITY `
            -ExpectedPublisher $env:ZIFILE_MSIX_PUBLISHER `
            -Provider $env:ZIFILE_SIGNING_PROVIDER
      - name: Remove ephemeral client authentication certificate
        if: always()
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'Certificate_pkcs12.p12'
          if (Test-Path -LiteralPath $certificate) {
            Remove-Item -LiteralPath $certificate -Force
          }
      - name: Attest signed Windows artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: artifacts-${{ matrix.architecture }}/*
      - uses: actions/upload-artifact@v6
        with:
          name: signed-windows-${{ matrix.architecture }}
          path: artifacts-${{ matrix.architecture }}/*
          if-no-files-found: error

  sbom:
    name: CycloneDX SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.93.0
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx@0.5.9
      - run: cargo cyclonedx --format json --all --target all
      - name: Collect SBOM files
        shell: bash
        run: |
          mkdir -p sbom
          find . -name '*.cdx.json' -not -path './target/*' -print0 | while IFS= read -r -d '' file; do
            name="${file#./}"
            name="${name%.cdx.json}"
            name="${name//\//-}"
            cp "$file" "sbom/${name}.cdx.json"
          done
          test -n "$(find sbom -type f -print -quit)"
      - uses: actions/upload-artifact@v6
        with:
          name: sbom
          path: sbom/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [sign, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: signed-windows-*
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@v7
        with:
          name: sbom
          path: release
      - name: Generate WinGet submission candidate
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $x64 = Get-ChildItem -LiteralPath release -Filter '*windows-x64.msix' | Select-Object -Single
          $arm64 = Get-ChildItem -LiteralPath release -Filter '*windows-arm64.msix' | Select-Object -Single
          $base = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}"
          ./packaging/winget/Generate-Manifests.ps1 `
            -Version $version `
            -X64InstallerUrl "$base/$($x64.Name)" `
            -X64InstallerSha256 (Get-FileHash -LiteralPath $x64.FullName -Algorithm SHA256).Hash `
            -Arm64InstallerUrl "$base/$($arm64.Name)" `
            -Arm64InstallerSha256 (Get-FileHash -LiteralPath $arm64.FullName -Algorithm SHA256).Hash
          Copy-Item -Path "target/winget/ZiCode.ZiFile/$version/*.yaml" -Destination release
      - name: Attest SBOM
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release/*.cdx.json
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: release/*
