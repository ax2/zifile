name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build release executables
        run: cargo build --workspace --release --locked
      - name: Stage artifacts and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Copy-Item target/release/zifile.exe artifacts/zifile-cli-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/zifile-desktop.exe artifacts/zifile-desktop-x86_64-pc-windows-msvc.exe
          Get-FileHash artifacts/*.exe -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLowerInvariant(), (Split-Path $_.Path -Leaf) } |
            Set-Content artifacts/SHA256SUMS.txt
      - name: Attest release executables
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: artifacts/*.exe
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
