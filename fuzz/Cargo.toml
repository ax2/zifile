[package]
name = "zifile-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
zifile-core = { path = "../crates/zifile-core" }

[[bin]]
name = "path_policy"
path = "fuzz_targets/path_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "format_detection"
path = "fuzz_targets/format_detection.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
